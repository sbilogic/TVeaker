app = "tveaker"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  TVEAKER_ENV = "production"
  TVEAKER_HOST = "0.0.0.0"
  TVEAKER_DATABASE_PATH = "/data/tveaker.db"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "tveaker_data"
  destination = "/data"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
