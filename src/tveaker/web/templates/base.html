<!DOCTYPE html>
<html lang="en" data-theme="system" data-density="comfortable">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}Home{% endblock %} · TVeaker</title>
  <script>
    (() => {
      const saved = localStorage.getItem('tveaker-theme');
      const theme = saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = theme;
      const density = localStorage.getItem('tveaker-density');
      document.documentElement.dataset.density = density === 'compact' ? 'compact' : 'comfortable';
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800;900&family=Instrument+Serif:ital@0;1&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300,0,0&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css?v=20260830-compact2">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <aside class="editorial-nav" aria-label="Primary navigation">
    <div class="nav-masthead">
      <a href="/" class="wordmark">TVeaker</a>
      <span class="sync-state"><i></i>{% if account %}{{ account.username }}{% else %}LOCAL{% endif %}</span>
    </div>
    <nav class="indexed-nav">
      <a href="/" class="indexed-nav-item {% if active_page == 'dashboard' %}active{% endif %}"><span class="nav-index">01</span><span class="material-symbols-rounded nav-icon">home</span><span>Home</span></a>
      <a href="/shows" class="indexed-nav-item {% if active_page == 'shows' %}active{% endif %}"><span class="nav-index">02</span><span class="material-symbols-rounded nav-icon">menu_book</span><span>Library</span></a>
      <a href="/recommendations" class="indexed-nav-item {% if active_page == 'recommendations' %}active{% endif %}"><span class="nav-index">03</span><span class="material-symbols-rounded nav-icon">explore</span><span>Discover</span></a>
      <a href="/history" class="indexed-nav-item {% if active_page == 'history' %}active{% endif %}"><span class="nav-index">04</span><span class="material-symbols-rounded nav-icon">history</span><span>History</span></a>
      <a href="/settings" class="indexed-nav-item {% if active_page == 'settings' %}active{% endif %}"><span class="nav-index">05</span><span class="material-symbols-rounded nav-icon">settings</span><span>Settings</span></a>
    </nav>
    <div class="nav-footer">
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch color theme">
        <span class="material-symbols-rounded" data-theme-icon>dark_mode</span><span data-theme-label>Dark</span>
      </button>
      <button class="density-toggle" type="button" data-density-toggle aria-label="Switch to compact mode" aria-pressed="false">
        <span class="material-symbols-rounded" data-density-icon>density_medium</span><span data-density-label>Compact</span>
      </button>
      <button class="nav-sync" type="button" onclick="triggerSync('incremental')">
        <span class="material-symbols-rounded">sync</span><span>Sync</span>
      </button>
    </div>
  </aside>
  <main class="main-content editorial-page editorial-page--{{ active_page|default('dashboard') }}">{% block content %}{% endblock %}</main>
</body>
</html>
